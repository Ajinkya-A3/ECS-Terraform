services:
  mock:
    build: ./mock
    environment:
      MOCK_FAIL_RATE: ${MOCK_FAIL_RATE:-0.20}
      MOCK_SIGMA: ${MOCK_SIGMA:-0.6}
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  service:
    build: ./service
    environment:
      PIPELINE_BACKEND: http
      PIPELINE_URL: http://mock:9000      # compose DNS name of the mock container
      REQUEST_TIMEOUT_S: "3"
      RETRY_ATTEMPTS: "3"
      BREAKER_FAIL_MAX: "5"
      BREAKER_RESET_S: "15"
    volumes:
      - dlq-data:/data                    # DLQ survives restarts
    ports:
      - "8000:8000"
    depends_on:
      mock:
        condition: service_healthy

volumes:
  dlq-data: